edition = "2023";

import "base/v1/common.proto";

option java_outer_classname = "MyGaruSDK";
// NOTE: go_package intentionally names the PUBLIC module path
// (github.com/mygaru/dcr-sdk), not this repository's own module path. protoc
// embeds this string, length-prefixed, into the FileDescriptorProto inside the
// generated *.pb.go. The sync_to_github CI job rewrites the internal module path
// to the public one with sed across every text file; on a *.pb.go that shortens
// the embedded string without touching its length prefix and leaves a descriptor
// that panics at init with "slice bounds out of range". Naming the public path
// here keeps the internal path out of the descriptor entirely, so the mirror has
// nothing to rewrite. See PROTO_GO_MODULE in the Makefile.
option go_package = "github.com/mygaru/dcr-sdk/gen/base1;base";

option features.field_presence = IMPLICIT;

package match;

message Match {

  // Describes a match rule
  message Rule {
    common.TrafficType traffic_type = 1;
    repeated uint32 segment_ids = 3;

    // payer is the UUID of the partner billed for this rule, in canonical text
    // form ("xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx").
    //
    // It sits on the rule so that a single request can cover segments belonging
    // to several different clients - a platform acting for its own clients bills
    // each of them in one call. Segment access is evaluated against this payer.
    //
    // When left empty the SDK fills it in from the request-level payer, so a
    // caller working for one client only never has to set it.
    // 4 is the first number this message has never used: 1 and 3 have been
    // taken since it was introduced, and 2 was never assigned.
    string payer = 4;
  }

  // Response description for a match
  enum ResponseStatus {
    OK = 0;
    MISS = 1;
    ACCESS_DENIED = 2;
    SERVICE_UNAVAILABLE = 3;
    UNKNOWN_SEGMENT = 4;
  }
}
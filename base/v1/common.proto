edition = "2023";

option java_outer_classname = "MyGaruSDK"; // Standardized PascalCase for outer classname
// NOTE: go_package intentionally names the PUBLIC module path
// (github.com/mygaru/dcr-sdk), not this repository's own module path. protoc
// embeds this string, length-prefixed, into the FileDescriptorProto inside the
// generated *.pb.go. The sync_to_github CI job rewrites the internal module path
// to the public one with sed across every text file; on a *.pb.go that shortens
// the embedded string without touching its length prefix and leaves a descriptor
// that panics at init with "slice bounds out of range". Naming the public path
// here keeps the internal path out of the descriptor entirely, so the mirror has
// nothing to rewrite. See PROTO_GO_MODULE in the Makefile.
option go_package = "github.com/mygaru/dcr-sdk/gen/base1;base";

package common;

// Enumeration for traffic types
enum TrafficType {
  TRAFFIC_TYPE_VIDEO = 0;
  TRAFFIC_TYPE_DISPLAY = 1;
  TRAFFIC_TYPE_AUDIO = 2;
  TRAFFIC_TYPE_NATIVE = 3;
  TRAFFIC_TYPE_VIDEO_SENSITIVE = 4;
  TRAFFIC_TYPE_DISPLAY_SENSITIVE = 5;

}

// Enumeration for event types
enum EventType {
  EVENT_TYPE_IMPRESSION = 0;            // Ad impression
  EVENT_TYPE_BILLING = 1;               // Billing event (e.g., click, install)
  EVENT_TYPE_VIEWABLE_IMPRESSION = 2;   // Viewable impression only
  EVENT_TYPE_CLICK = 4;                 // Click event
  EVENT_TYPE_WINS = 5;                  // Wins
  EVENT_TYPE_AT = 6;                    // Action Trackers
  EVENT_TYPE_BIDS = 7;                  // Bids
}

// Common match statuses
enum RPCServerResponseCode {
  UNKNOWN = 0;
  OK = 1;
  UNAUTHORIZED = 2;
  SERVICE_UNAVAILABLE = 3;
  OUTDATED = 4;
  INVALID_REQUEST = 5;
  TECH_ERROR = 6;
  NETWORK_ERROR = 7;
}
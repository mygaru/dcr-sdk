edition = "2023";

import "base/v1/frequency.proto";
import "base/v1/match.proto";
import "base/v1/user.proto";
import "base/v1/common.proto";

option java_outer_classname = "myGaruSDK";
// NOTE: go_package intentionally names the PUBLIC module path
// (github.com/mygaru/dcr-sdk), not this repository's own module path. protoc
// embeds this string, length-prefixed, into the FileDescriptorProto inside the
// generated *.pb.go. The sync_to_github CI job rewrites the internal module path
// to the public one with sed across every text file; on a *.pb.go that shortens
// the embedded string without touching its length prefix and leaves a descriptor
// that panics at init with "slice bounds out of range". Naming the public path
// here keeps the internal path out of the descriptor entirely, so the mirror has
// nothing to rewrite. See PROTO_GO_MODULE in the Makefile.
option go_package = "github.com/mygaru/dcr-sdk/gen/base1;base";

option features.field_presence = IMPLICIT;

package target;

message TargetRequest {
  // Field 7 held a single request-level payer. The payer now lives on each
  // match rule so that one request can check the segments of several clients.
  // It is reserved because 7 was already on main (commit 17826c8) and may have
  // been pulled by a consumer; drop the reservation if nothing ever consumed it.
  reserved 7;

  // List of user identifiers currently available.
  repeated user.UID uids = 1;

  // Rules for private frequency capping validation.
  repeated frequency.Frequency.Rule frequency = 2;

  // List of segment matching rules to evaluate.
  repeated match.Match.Rule match = 3;

  // By default, Cloud returns an error if at least one segment check fails.
  // This behavior can be overridden by setting individual_errors = true.
  bool individual_errors = 4;

  user.Context context = 5;

  Inventory inventory = 6;

  message Inventory {
    // DSP Root Inventory ID
    uint64 Id = 1;
    // DSP Account ID
    uint64 AccountID = 2;
    // SSP Publisher ID
    uint64 PublisherID = 3;
    // SSP Source ID
    uint64 Aid = 4;
  }
}

message TargetResponse {
  // Tracking id for BE reporting
  bytes tracking_id = 1;

  common.RPCServerResponseCode status_code = 2;

  // List of responses corresponding to the frequency rules.
  repeated frequency.Frequency.ResponseStatus frequency = 3;

  // List of responses for the match rules.
  repeated match.Match.ResponseStatus match = 4;
}